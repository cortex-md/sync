services:
  migrate:
    container_name: cortex-sync-migrate
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate", "up"]
    environment:
      CORTEX_DATABASE_URL: postgres://cortex:cortex@postgres:5432/cortex_sync?sslmode=disable
      CORTEX_STORAGE_BACKEND: local
      CORTEX_STORAGE_ENDPOINT: s3:8333
      CORTEX_STORAGE_ACCESS_KEY: minioadmin
      CORTEX_STORAGE_SECRET_KEY: minioadmin
      CORTEX_STORAGE_BUCKET: cortex-snapshots
    depends_on:
      postgres:
        condition: service_healthy

  sync: &sync
    container_name: cortex-sync
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      CORTEX_SERVER_ENV: ${CORTEX_SERVER_ENV:-development}
      CORTEX_DATABASE_URL: postgres://cortex:cortex@postgres:5432/cortex_sync?sslmode=disable
      CORTEX_DATABASE_MAX_CONNS: 10
      CORTEX_DATABASE_MIN_CONNS: 2
      CORTEX_STORAGE_BACKEND: local
      CORTEX_STORAGE_ENDPOINT: s3:8333
      CORTEX_STORAGE_ACCESS_KEY: minioadmin
      CORTEX_STORAGE_SECRET_KEY: minioadmin
      CORTEX_STORAGE_BUCKET: cortex-snapshots
      CORTEX_AUTH_ACCESS_TOKEN_SECRET: ${CORTEX_AUTH_ACCESS_TOKEN_SECRET:-dev-only-change-this-token-secret-32}
      CORTEX_AUTH_REGISTRATION_MODE: ${CORTEX_AUTH_REGISTRATION_MODE:-open}
      CORTEX_SUBSCRIPTION_ENABLED: ${CORTEX_SUBSCRIPTION_ENABLED:-false}
      CORTEX_SUBSCRIPTION_STRIPE_SECRET_KEY: ${CORTEX_SUBSCRIPTION_STRIPE_SECRET_KEY:-}
      CORTEX_SUBSCRIPTION_STRIPE_PRICE_ID: ${CORTEX_SUBSCRIPTION_STRIPE_PRICE_ID:-}
      CORTEX_SUBSCRIPTION_STRIPE_WEBHOOK_SECRET: ${CORTEX_SUBSCRIPTION_STRIPE_WEBHOOK_SECRET:-}
      CORTEX_SUBSCRIPTION_CACHE_TTL: ${CORTEX_SUBSCRIPTION_CACHE_TTL:-60s}
      CORTEX_SUBSCRIPTION_RENEWAL_GRACE: ${CORTEX_SUBSCRIPTION_RENEWAL_GRACE:-48h}
      CORTEX_DEVOPS_DISCORD_WEBHOOK_URL: ${CORTEX_DEVOPS_DISCORD_WEBHOOK_URL:-}
      CORTEX_DEVOPS_DISCORD_USERNAME: ${CORTEX_DEVOPS_DISCORD_USERNAME:-Cortex DevOps}
      CORTEX_DEVOPS_DISCORD_TIMEOUT: ${CORTEX_DEVOPS_DISCORD_TIMEOUT:-5s}
      CORTEX_SERVER_PUBLIC_URL: ${CORTEX_SERVER_PUBLIC_URL:-http://localhost:8080}
      CORTEX_TENANCY_MODE: ${CORTEX_TENANCY_MODE:-single}
      CORTEX_VAULT_CREATION: ${CORTEX_VAULT_CREATION:-everyone}
      CORTEX_FEATURE_COLLAB: ${CORTEX_FEATURE_COLLAB:-true}
      CORTEX_FEATURE_AVATARS: ${CORTEX_FEATURE_AVATARS:-true}
      CORTEX_FEATURE_GUESTS: ${CORTEX_FEATURE_GUESTS:-true}
      CORTEX_FEATURE_PUBLIC_LINKS: ${CORTEX_FEATURE_PUBLIC_LINKS:-true}
      CORTEX_FEATURE_EMAIL_VERIFICATION: ${CORTEX_FEATURE_EMAIL_VERIFICATION:-auto}
      CORTEX_FEATURE_PASSWORD_RESET: ${CORTEX_FEATURE_PASSWORD_RESET:-auto}
      CORTEX_MAIL_DRIVER: ${CORTEX_MAIL_DRIVER:-log}
      CORTEX_MAIL_HOST: ${CORTEX_MAIL_HOST:-}
      CORTEX_MAIL_PORT: ${CORTEX_MAIL_PORT:-587}
      CORTEX_MAIL_USERNAME: ${CORTEX_MAIL_USERNAME:-}
      CORTEX_MAIL_PASSWORD: ${CORTEX_MAIL_PASSWORD:-}
      CORTEX_MAIL_FROM: ${CORTEX_MAIL_FROM:-Cortex <no-reply@localhost>}
      CORTEX_MAIL_TLS_MODE: ${CORTEX_MAIL_TLS_MODE:-starttls}
      CORTEX_SERVER_DRAIN_DELAY: ${CORTEX_SERVER_DRAIN_DELAY:-0s}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/ready",
        ]
  postgres:
    container_name: cortex-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex_sync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex_sync"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: "0.50"

  s3:
    container_name: cortex-s3
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "9000:8333"
    volumes:
      - s3data:/data
      - ./deploy/local/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    cpus: "0.50"

  sync-replica:
    <<: *sync
    container_name: cortex-sync-replica
    profiles: ["replicas"]
    ports:
      - "8081:8080"

  mailpit:
    container_name: cortex-mailpit
    image: axllent/mailpit:v1.27
    profiles: ["replicas"]
    ports:
      - "1025:1025"
      - "8025:8025"
    mem_limit: 64m

volumes:
  pgdata:
  s3data:
