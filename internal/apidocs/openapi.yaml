openapi: 3.1.0
info:
  title: Cortex Sync API
  version: '1'
  description: |
    HTTP API of Cortex Sync, the self-hostable sync server for Cortex vaults.

    **End-to-end encryption.** Note content, deltas, collab updates, shared notes and team templates are encrypted on
    the client. The server only stores and relays opaque ciphertext and wrapped keys (vault keys sealed to each
    member's X25519 public key, the password-wrapped private key); it never sees plaintext or anything that can
    unwrap it.

    **Authentication.** Authenticated routes need `Authorization: Bearer <access_token>` (an HS256 JWT from
    `POST /auth/v1/login` or `/auth/v1/token/refresh`) and the `X-Device-ID: <uuid>` header of the device the token was
    issued to. A missing or invalid `X-Device-ID` is `400 invalid_input`; a different one is `401 device_mismatch`.
    Public routes (health, capabilities, auth, email links, invite and share pages) need neither. The collab
    WebSocket authenticates with a short-lived `ticket` query parameter instead.

    **Errors.** Every error, including rate limits, body limits and panics, uses the envelope
    `{"error": "message", "code": "machine_code", "details": ...}`. Branch on `code`, never on `error`. Without a
    specific code the code follows the status: `400 invalid_input`, `401 unauthorized`, `402 subscription_required`,
    `403 forbidden`, `404 not_found`, `409 already_exists`, `410 gone`, `413 file_too_large`, `429 rate_limited`,
    `503 unavailable`, other `5xx` `internal_error`.

    **Retry-After.** `429` and `503` responses caused by a limit carry `Retry-After` (seconds) when the server knows how
    long to wait. Clients should wait at least that long before retrying.

    **Optional features.** Collab, avatars, public links, email verification and password reset can be switched off
    per server (see `GET /meta/v1/capabilities`). A route whose feature is disabled answers
    `404 {"code": "feature_disabled"}`. Subscription routes and the Stripe webhook only exist when subscriptions are
    enabled.
servers:
- url: /
tags:
- name: Health
- name: Meta
- name: Auth
- name: Account
- name: Devices
- name: Subscription
- name: Vaults
- name: Members
- name: Access
- name: Invites
- name: Keys
- name: Files
- name: Changes
- name: Realtime
- name: Collab
- name: Shares
- name: Templates
- name: Pages
- name: Webhooks
paths:
  /account/v1/email/confirm-change:
    get:
      operationId: confirmEmailChangePage
      tags:
      - Pages
      summary: Email change confirmation page
      description: |
        HTML page with a confirm button posting to `POST /account/v1/email/confirm-change`. Feature-gated by `email_verification`.
      parameters:
      - name: token
        in: query
        required: true
        description: Single-use token from the email link.
        schema:
          type: string
      responses:
        '200':
          description: HTML confirmation page
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '410':
          description: 'HTML page: link expired or already used'
          content:
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
    post:
      operationId: confirmEmailChange
      tags:
      - Account
      summary: Confirm an email change
      description: |
        Form post (HTML response) or JSON `{ "token" }` (`200 {"status":"ok"}`). Feature-gated by `email_verification`.

        Error codes (JSON): `400 invalid_input`, `404 not_found`, `404 feature_disabled`, `409 email_taken` (the address
        was taken meanwhile). Form posts answer `409`/`410` with HTML pages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
      responses:
        '200':
          description: Email changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '409':
          description: Address taken meanwhile (`email_taken` JSON, or HTML page)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/html:
              schema:
                type: string
        '410':
          description: 'HTML page: token expired (form posts)'
          content:
            text/html:
              schema:
                type: string
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /account/v1/email/verify:
    get:
      operationId: verifyEmailPage
      tags:
      - Pages
      summary: Email verification page
      description: |
        HTML page with a confirm button that posts the token to `POST /account/v1/email/verify`. GET never consumes the token. Feature-gated by `email_verification` (`404 feature_disabled`, JSON).
      parameters:
      - name: token
        in: query
        required: true
        description: Single-use token from the email link.
        schema:
          type: string
      responses:
        '200':
          description: HTML confirmation page
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '410':
          description: 'HTML page: link expired or already used'
          content:
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
    post:
      operationId: verifyEmail
      tags:
      - Account
      summary: Confirm an email address
      description: |
        Accepts a form post from the HTML page (answers with an HTML page) or JSON `{ "token" }` (answers
        `200 {"status":"ok"}`). Feature-gated by `email_verification`.

        Error codes (JSON): `400 invalid_input`, `404 not_found` (unknown or expired token), `404 feature_disabled`.
        Form posts answer `410` with an HTML page for expired tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '410':
          description: 'HTML page: token expired (form posts)'
          content:
            text/html:
              schema:
                type: string
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /account/v1/me/:
    get:
      operationId: getMe
      tags:
      - Account
      summary: Get the current account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        deviceId: []
    patch:
      operationId: updateMe
      tags:
      - Account
      summary: Update display name or locale
      description: |
        Both fields are optional; `locale` is `en` or `pt-BR`.

        Error codes: `400 invalid_input`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        deviceId: []
  /account/v1/me/avatar:
    put:
      operationId: setAvatar
      tags:
      - Account
      summary: Upload an avatar
      description: |
        Raw image body (JPEG, PNG, GIF or WebP, up to `limits.avatar_max_bytes`). The image is center-cropped, resized
        and re-encoded as JPEG with metadata stripped. Feature-gated by `avatars`.

        Error codes: `400 invalid_input` (not an image), `404 feature_disabled`, `413 file_too_large`.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        deviceId: []
    delete:
      operationId: deleteAvatar
      tags:
      - Account
      summary: Remove the avatar
      description: |
        Feature-gated by `avatars` (`404 feature_disabled`).
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        deviceId: []
  /account/v1/me/email:
    post:
      operationId: requestEmailChange
      tags:
      - Account
      summary: Change the email address
      description: |
        `password` is the auth key for `kdf_version: 1` accounts. With email verification enabled the server sends a
        confirmation link and answers `202 {"status":"confirmation_sent"}`; otherwise the email changes immediately
        (`200 {"status":"changed"}`) and is marked unverified.

        Error codes: `400 invalid_input`, `401 invalid_credentials`, `409 email_taken`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEmailChangeRequest'
      responses:
        '200':
          description: 'Email changed (`status: changed`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '202':
          description: 'Confirmation sent (`status: confirmation_sent`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        deviceId: []
  /account/v1/me/email/verification:
    post:
      operationId: sendEmailVerification
      tags:
      - Account
      summary: Resend the verification email
      description: |
        Feature-gated by `email_verification` (`404 feature_disabled`).
      responses:
        '202':
          description: 'Sent (`status: verification_sent`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        deviceId: []
  /account/v1/me/keys:
    get:
      operationId: getAccountKeys
      tags:
      - Account
      summary: Get the account identity key material
      description: |
        Returns the KDF salt, public key and password-wrapped private key (all opaque to the server).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountKeys'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        deviceId: []
    put:
      operationId: setupAccountKeys
      tags:
      - Account
      summary: Set up or replace the account identity
      description: |
        Also upgrades `kdf_version: 0` accounts. Sets the password hash from `password` and `kdf_version: 1`; sessions
        stay valid. When `public_key` differs from the stored one, the user's vault keys are deleted and
        `member_key_changed` is emitted in every vault; the recovery wrap is cleared unless a new one is sent.
        Rate limited as a sensitive route.

        Error codes: `400 invalid_input`, `401 invalid_credentials`, `503 server_busy`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupKeysRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountKeys'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - bearerAuth: []
        deviceId: []
  /account/v1/me/password:
    put:
      operationId: changePassword
      tags:
      - Account
      summary: Change the password
      description: |
        For `kdf_version: 1` accounts both passwords are auth keys and `kdf_salt` plus the re-wrapped
        `encrypted_private_key` are required; legacy accounts must not send them. Revokes the sessions of every other
        device and emails a notice.

        Error codes: `400 invalid_input`, `401 invalid_credentials`, `503 server_busy`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - bearerAuth: []
        deviceId: []
  /account/v1/me/public-key:
    put:
      operationId: setPublicKey
      tags:
      - Keys
      summary: Set the public key (legacy accounts)
      description: |
        Legacy accounts only. Error codes: `400 invalid_input`, `409` when a `kdf_version: 1` account sends a different key (use `PUT /account/v1/me/keys`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicKeyRequest'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        deviceId: []
  /account/v1/me/recovery:
    put:
      operationId: setRecoveryKey
      tags:
      - Account
      summary: Store the recovery-wrapped private key
      description: |
        Error codes: `400 invalid_input`, `409 keys_not_set_up` (`kdf_version: 0` accounts).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountKeys'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        deviceId: []
  /account/v1/overview:
    get:
      operationId: getAccountOverview
      tags:
      - Account
      summary: Everything a client needs after login
      description: |
        Account, devices with their vault cursors, vaults, pending invites and (when subscriptions are enabled) the subscription status. Heavy route (per-user heavy rate limit).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        deviceId: []
  /account/v1/password/forgot:
    post:
      operationId: forgotPassword
      tags:
      - Account
      summary: Request a password reset email
      description: |
        Always `202`, whether or not the account exists. JSON answers `{"status":"reset_sent_if_account_exists"}`;
        a form post (`application/x-www-form-urlencoded`, field `email`) answers an HTML page.
        Feature-gated by `password_reset`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /account/v1/password/reset:
    get:
      operationId: resetPasswordPage
      tags:
      - Pages
      summary: Password reset page
      description: |
        HTML page with an "Open Cortex" button linking `cortex://reset-password?token=<token>&server=<public url>`. Expired tokens answer `410` with a page offering to resend. Feature-gated by `password_reset`.
      parameters:
      - name: token
        in: query
        required: true
        description: Single-use token from the email link.
        schema:
          type: string
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '410':
          description: 'HTML page: link expired or already used'
          content:
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
    post:
      operationId: resetPassword
      tags:
      - Account
      summary: Reset the password with a token
      description: |
        JSON (or legacy form post). Reset with `kdf_salt` makes the account `kdf_version: 1` (`public_key` and
        `encrypted_private_key` required). Without key fields the account returns to `kdf_version: 0`, its identity
        and vault keys are deleted and `member_key_changed` is emitted. Revokes every session. Feature-gated by
        `password_reset`.

        Error codes (JSON): `400 invalid_input`, `404 not_found` (unknown or expired token), `404 feature_disabled`,
        `503 server_busy`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
              required:
              - token
              - password
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '410':
          description: 'HTML page: token expired (form posts)'
          content:
            text/html:
              schema:
                type: string
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
  /account/v1/password/reset/prepare:
    post:
      operationId: prepareResetPassword
      tags:
      - Account
      summary: Fetch key material before a reset
      description: |
        Does not consume the token. Error codes: `404 not_found` (unknown or expired token), `404 feature_disabled`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPrepareRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPrepareResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /auth/v1/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: Log in and register the device
      description: |
        Exchanges credentials for an access/refresh token pair bound to `device_id` (client-generated uuid).
        `public_key` and `encrypted_private_key` are `null` for `kdf_version: 0` accounts. Repeated failures for the
        same email and client IP lock login (1 minute, doubling up to 1 hour).

        Error codes: `400 invalid_input`, `401 invalid_credentials`, `403 device_revoked`, `403 limit_reached`
        (device cap), `409 device_conflict`, `429 too_many_attempts` (with `Retry-After`) or `rate_limited`,
        `503 server_busy`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
