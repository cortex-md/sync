      responses:
        '200':
          description: Framed batch stream
          headers:
            X-Batch-Count:
              $ref: '#/components/headers/XBatchCount'
          content:
            application/vnd.cortex.batch:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
