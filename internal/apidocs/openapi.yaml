  /sync/v1/vaults/{vaultID}/events:
    get:
      operationId: streamEvents
      tags:
      - Realtime
      summary: Server-Sent Events stream of vault changes
      description: |
        Long-lived `text/event-stream`. The first frame is `retry: 5000`. With `Last-Event-ID` the server replays missed
        events before live ones, or sends a `reset` event (`data: {"reason":"cursor_expired"}`, no `id`) when the cursor
        is older than the retained history: discard the cursor, run a full resync and keep the stream open.

        Events with `id` (replayable): `file_created`, `file_updated`, `file_deleted`, `file_renamed` (data: `SyncEventData`).
        Ephemeral events (no `id`): `collab_active`, `collab_inactive` (`{"file_path"}`), `member_joined`
        (`{"user_id","role","has_key"}`), `member_role_changed` (`{"user_id","role"}`), `member_removed`, `key_granted`,
        `member_key_changed` (`{"user_id"}`), `access_changed` (`{}`). `ping` (`data: {}`) every 30 seconds.

        Events are filtered to paths the caller can view. A change of the caller's own role or removal closes the
        stream. Requires an active entitlement when subscription enforcement is enabled (in multi-tenant mode the vault owner's; `402`).

        Error codes: `403 forbidden`, `503 server_busy` (stream limits, `Retry-After`), `503 unavailable` (draining).
      parameters:
      - $ref: '#/components/parameters/VaultID'
      - name: Last-Event-ID
        in: header
        required: false
        description: Resume after this event id (replay).
        schema:
          type: string
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: 'SSE frames: `id:`, `event:`, `data:` lines separated by blank lines.'
              example: |+
                retry: 5000

                id: 42
                event: file_updated
                data: {"vault_uuid":"...","file_path":"notes/a.md","version":2,"actor_id":"...","device_id":"..."}

                event: ping
                data: {}

        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - bearerAuth: []
        deviceId: []
  /sync/v1/vaults/{vaultID}/files:
    post:
      operationId: uploadSnapshot
      tags:
      - Files
      summary: Upload an encrypted file snapshot
      description: |
        Raw ciphertext body. `Content-Length` is required (`411 length_required` otherwise). If the checksum matches the
        current, non-deleted version no snapshot is created and the answer is `200` with the existing file info.
        Requires an active entitlement when subscription enforcement is enabled (in multi-tenant mode the vault owner's; `402`).

        Error codes: `400 invalid_input`, `403 insufficient_role`, `409 conflict` (X-Base-Version mismatch),
        `411 length_required`, `413 file_too_large`, `413`/`429 upload_budget_exceeded`, `503 server_busy` (too many
        concurrent uploads, `Retry-After`), `507 quota_exceeded`.
      parameters:
      - $ref: '#/components/parameters/VaultID'
      - name: X-File-Path
        in: header
        required: true
        description: Vault-relative file path.
        schema:
          type: string
      - name: X-File-Path-Encoding
        in: header
        required: false
        description: '`uri` when `X-File-Path` is percent-encoded (required for non-ASCII paths).'
        schema:
          type: string
          enum:
          - uri
      - name: X-Base-Version
        in: header
        required: false
        description: Expected current version; a mismatch returns `409 conflict`.
        schema:
          type: integer
          minimum: 0
      - name: X-Local-Hash
        in: header
        required: false
        description: Client-computed checksum.
        schema:
          type: string
      - name: X-Checksum
        in: header
        required: false
        description: Alias for `X-Local-Hash`, used when it is absent.
        schema:
          type: string
      - name: X-Content-Type
        in: header
        required: false
        description: Original content type (default `application/octet-stream`).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Unchanged (checksum matches the current version)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '201':
          description: Snapshot stored (includes `snapshot_id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '411':
          $ref: '#/components/responses/LengthRequired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '507':
          $ref: '#/components/responses/InsufficientStorage'
      security:
      - bearerAuth: []
        deviceId: []
    get:
      operationId: downloadSnapshot
      tags:
      - Files
      summary: Download an encrypted file snapshot
      description: |
        Without `version` the latest snapshot is served and `X-File-Version` is the file's current version (it can be
        ahead of the snapshot when deltas follow). With `version` the newest snapshot at or before it is served.
        `304` when `If-None-Match` equals the snapshot `ETag`. Requires an active entitlement when subscription enforcement is enabled (in multi-tenant mode the vault owner's; `402`).

        Error codes: `400 invalid_input`, `403 vault_access_denied` / `insufficient_role`, `404 not_found` (also the
        latest version of a deleted file).
      parameters:
      - $ref: '#/components/parameters/VaultID'
      - name: path
        in: query
        required: true
        description: Vault-relative file path.
        schema:
          type: string
      - name: version
        in: query
        required: false
        description: Specific version (default latest).
        schema:
          type: integer
          minimum: 0
      - name: If-None-Match
        in: header
        required: false
        description: ETag of a previous download.
        schema:
          type: string
      responses:
        '200':
          description: Encrypted snapshot bytes
          headers:
            X-File-Path:
              $ref: '#/components/headers/XFilePath'
            X-File-Path-Encoded:
              $ref: '#/components/headers/XFilePathEncoded'
            X-File-Version:
              $ref: '#/components/headers/XFileVersion'
            X-Snapshot-Version:
              $ref: '#/components/headers/XSnapshotVersion'
            X-Checksum:
              $ref: '#/components/headers/XChecksum'
            X-Size-Bytes:
              $ref: '#/components/headers/XSizeBytes'
            X-Created-By:
              $ref: '#/components/headers/XCreatedBy'
            X-Author-Device-ID:
              $ref: '#/components/headers/XAuthorDeviceID'
            X-Device-ID:
              $ref: '#/components/headers/XDeviceIDResponse'
            X-Snapshot-ID:
              $ref: '#/components/headers/XSnapshotID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        deviceId: []
    delete:
      operationId: deleteFile
      tags:
      - Files
      summary: Delete a file
      description: |
        Soft-deletes the file (bumps its version) and its exact-file access rule. Requires an active entitlement when subscription enforcement is enabled (in multi-tenant mode the vault owner's; `402`).

        Error codes: `400 invalid_input`, `403 insufficient_role`, `404 not_found`, `409 conflict`.
      parameters:
      - $ref: '#/components/parameters/VaultID'
      - name: path
        in: query
        required: true
        description: Vault-relative file path.
        schema:
          type: string
      - name: X-Base-Version
        in: header
        required: false
        description: Expected current version; a mismatch returns `409 conflict`.
        schema:
          type: integer
          minimum: 0
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        deviceId: []
  /sync/v1/vaults/{vaultID}/files/batch:
    post:
      operationId: batchDownload
      tags:
      - Files
      summary: Download many snapshots in one stream
      description: |
        `version: 0` means latest. Limits: 1-200 items and 64 MiB total (`limits.batch_max_items` /
        `limits.batch_max_bytes`); one batch per user at a time (`503 server_busy`). Requires an active entitlement when subscription enforcement is enabled (in multi-tenant mode the vault owner's; `402`).

        The `200` body (`application/vnd.cortex.batch`) is one frame per requested item, in request order:

        | Field | Type |
        |-------|------|
        | header length | u32, big-endian |
        | header | JSON (`BatchFrameHeader`), `header length` bytes |
        | body length | u64, big-endian |
        | body | raw encrypted snapshot, `body length` bytes (0 when `status` is not `ok`) |

        Error codes (before streaming starts): `400 invalid_input`, `403 vault_access_denied`, `413 file_too_large`,
        `503 server_busy`.
      parameters:
      - $ref: '#/components/parameters/VaultID'
      requestBody:
        required: true
