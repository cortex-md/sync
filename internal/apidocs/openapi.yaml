      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - bearerAuth: []
        deviceId: []
  /webhooks/stripe:
    post:
      operationId: stripeWebhook
      tags:
      - Webhooks
      summary: Stripe webhook receiver
      description: |
        Called by Stripe. The raw body is validated against the `Stripe-Signature` header with the webhook endpoint
        secret. Handled events: `checkout.session.completed`, `customer.subscription.created`,
        `customer.subscription.updated`, `customer.subscription.deleted`; other events and duplicate event ids answer
        `200` without processing. Only registered when subscriptions are enabled.

        Error codes: `400 invalid_input` (invalid payload), `401 unauthorized` (missing or invalid signature).
      parameters:
      - name: Stripe-Signature
        in: header
        required: true
        description: Stripe webhook signature header.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /auth/v1/login` or `POST /auth/v1/token/refresh`.
    deviceId:
      type: apiKey
      in: header
      name: X-Device-ID
      description: Device uuid the access token was issued to (the `device_id` sent at login).
  parameters:
    VaultID:
      name: vaultID
      in: path
      required: true
      description: Vault id.
      schema:
        type: string
        format: uuid
    DeviceID:
      name: deviceID
      in: path
      required: true
      description: Device id.
      schema:
        type: string
        format: uuid
    UserID:
      name: userID
      in: path
      required: true
      description: User id.
      schema:
        type: string
        format: uuid
    GroupID:
      name: groupID
      in: path
      required: true
      description: Group id.
      schema:
        type: string
        format: uuid
    InviteID:
      name: inviteID
      in: path
      required: true
      description: Invite id.
      schema:
        type: string
        format: uuid
    ShareID:
      name: shareID
      in: path
      required: true
      description: Share id (22-character base64url).
      schema:
        type: string
    TemplateID:
      name: templateID
      in: path
      required: true
      description: Template id.
      schema:
        type: string
        format: uuid
    Token:
      name: token
      in: path
      required: true
      description: Invite token.
      schema:
        type: string
    Slug:
      name: slug
      in: path
      required: true
      description: Public template slug (12-character base64url).
      schema:
        type: string
    AvatarFile:
      name: file
      in: path
      required: true
      description: Content-addressed avatar file name (`<hash>.jpg`).
      schema:
        type: string
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    ETag:
      description: Entity tag of the returned representation.
      schema:
        type: string
    CacheControl:
      description: Caching directives.
      schema:
        type: string
    XFilePath:
      description: File path of the served snapshot.
      schema:
        type: string
    XFilePathEncoded:
      description: Percent-encoded file path, safe for non-ASCII names.
      schema:
        type: string
    XFileVersion:
      description: File version (current version for latest downloads, snapshot version otherwise).
      schema:
        type: integer
    XSnapshotVersion:
      description: Version of the served snapshot.
      schema:
        type: integer
    XChecksum:
      description: Snapshot checksum.
      schema:
        type: string
    XSizeBytes:
      description: Snapshot size in bytes.
      schema:
        type: integer
        format: int64
    XCreatedBy:
      description: User id that created the snapshot.
      schema:
        type: string
        format: uuid
    XAuthorDeviceID:
      description: Device id that created the snapshot.
      schema:
        type: string
        format: uuid
    XDeviceIDResponse:
      description: Same as `X-Author-Device-ID` (kept for older clients).
      schema:
        type: string
        format: uuid
    XSnapshotID:
      description: Snapshot id.
      schema:
        type: string
        format: uuid
    XNextCursor:
      description: Cursor for the next page; absent when there is none.
      schema:
        type: string
    XHasMore:
      description: '`true` when the page is full and more events may follow.'
      schema:
        type: boolean
    XLatestEventID:
      description: Latest sync event id of the vault when the response was built.
      schema:
        type: integer
        format: int64
    XBatchCount:
      description: Number of frames in the batch body.
      schema:
        type: integer
    XShareRevision:
      description: Revision of the shared note.
      schema:
        type: integer
  responses:
    BadRequest:
      description: 'Bad request. Codes: `invalid_input` (malformed body, header or query parameter, missing or invalid `X-Device-ID`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Unauthorized. Codes: `unauthorized` (missing or malformed `Authorization`), `token_invalid` (invalid,
        expired or revoked access token), `device_mismatch` (`X-Device-ID` differs from the token''s device), `invalid_credentials`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: 'Subscription enforcement is enabled and the user (or vault owner) is not entitled. Codes: `subscription_required`,
        `subscription_expired`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Forbidden. Codes: `forbidden`, `vault_access_denied`, `insufficient_role`, `domain_not_allowed`, `email_not_verified`,
        `limit_reached`, `registration_closed`, `device_revoked`, `public_links_disabled`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'Not found. Code: `not_found`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FeatureDisabled:
      description: The resource was not found (`not_found`) or the optional feature that gates this route is disabled on this
        server (`feature_disabled`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'Conflict. Codes: `conflict` (file version), `path_exists`, `already_exists`, `key_exists`, `keys_not_set_up`,
        `group_name_taken`, `email_taken`, `user_exists`, `device_conflict`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: 'Gone. Codes: `cursor_expired`, `invite_expired`, `gone`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LengthRequired:
      description: 'Upload without `Content-Length`. Code: `length_required`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: 'Payload too large. Codes: `payload_too_large` (JSON body above `limits.max_json_body_bytes`), `file_too_large`,
        `delta_too_large`, `upload_budget_exceeded`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 'Rate limited. Codes: `rate_limited`, `too_many_attempts`, `upload_budget_exceeded`. Wait at least `Retry-After`
        seconds.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    InternalError:
      description: 'Unexpected server error. Code: `internal_error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 'Temporarily unavailable. Codes: `server_busy` (concurrency cap), `unavailable` (draining). Retry after
        `Retry-After` seconds.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    InsufficientStorage:
      description: 'Vault storage quota exceeded (multi-tenant mode). Code: `quota_exceeded`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotModified:
      description: Not Modified (`If-None-Match` matched the current `ETag`).
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human readable message. Do not branch on it.
        code:
          type: string
          description: Machine readable code, e.g. `invalid_input`, `unauthorized`, `token_invalid`, `device_mismatch`, `forbidden`,
            `insufficient_role`, `not_found`, `feature_disabled`, `conflict`, `rate_limited`, `server_busy`, `internal_error`.
        details:
          description: Optional extra information.
      required:
      - error
    StatusResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - ready
          - draining
          - database_unavailable
          - storage_unavailable
      required:
      - status
    Capabilities:
      type: object
      properties:
        version:
          type: string
        tenancy_mode:
          type: string
          enum:
          - single
          - multi
        features:
          type: object
          properties:
            collab:
              type: boolean
            avatars:
              type: boolean
            guests:
              type: boolean
            public_links:
              type: boolean
            email:
              type: boolean
            email_invites:
              type: boolean
            email_verification:
              type: boolean
            password_reset:
              type: boolean
            subscription:
              type: boolean
            registration_mode:
              type: string
              enum:
              - open
              - first-user
              - closed
            vault_creation:
              type: string
              enum:
              - everyone
              - admins
        limits:
          type: object
          properties:
            max_file_size:
              type: integer
              format: int64
            max_upload_bytes:
              type: integer
              format: int64
            max_json_body_bytes:
              type: integer
              format: int64
            max_delta_bytes:
              type: integer
              format: int64
            avatar_max_bytes:
              type: integer
              format: int64
            batch_max_items:
              type: integer
            batch_max_bytes:
              type: integer
              format: int64
            max_concurrent_uploads_per_user:
              type: integer
            upload_bytes_per_hour:
              type: integer
              format: int64
            max_event_streams_per_user:
              type: integer
            max_collab_sockets_per_user:
              type: integer
            default_vault_quota_bytes:
              type: integer
              format: int64
            max_vaults_per_user:
              type: integer
            max_devices_per_user:
              type: integer
            protection:
              type: string
              enum:
              - 'off'
              - standard
              - strict
          required:
          - max_file_size
          - max_upload_bytes
          - max_json_body_bytes
          - max_delta_bytes
          - avatar_max_bytes
          - batch_max_items
          - batch_max_bytes
          - protection
      required:
      - version
      - tenancy_mode
      - features
      - limits
    PreloginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PreloginResponse:
      type: object
      properties:
        kdf_version:
          type: integer
          enum:
          - 0
          - 1
        kdf_salt:
          type: string
          format: byte
          contentEncoding: base64
          description: '16 bytes; omitted for `kdf_version: 0`.'
        kdf:
          type: object
          properties:
            algorithm:
              type: string
              enum:
              - argon2id
            memory_kib:
              type: integer
            iterations:
              type: integer
            parallelism:
              type: integer
      required:
      - kdf_version
      - kdf
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: 'Auth key (base64url) for `kdf_version: 1`, raw password for legacy accounts. Min 8 characters.'
        display_name:
          type: string
        locale:
          type: string
          enum:
          - en
          - pt-BR
        kdf_salt:
          type: string
          format: byte
          contentEncoding: base64
        public_key:
          type: string
          format: byte
          contentEncoding: base64
        encrypted_private_key:
          type: string
          format: byte
          contentEncoding: base64
        recovery_wrapped_private_key:
          type: string
          format: byte
          contentEncoding: base64
      required:
      - email
      - password
      - display_name
    RegisterResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
      required:
      - user_id
      - email
      - display_name
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device_id:
          type: string
          format: uuid
        device_name:
          type: string
        device_type:
          type: string
      required:
      - email
      - password
      - device_id
      - device_name
      - device_type
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: HS256 JWT
        refresh_token:
          type: string
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          description: Omitted when unset.
        email_verified:
          type: boolean
        locale:
          type: string
        kdf_version:
          type: integer
          enum:
          - 0
          - 1
        public_key:
          type:
          - string
          - 'null'
          contentEncoding: base64
        encrypted_private_key:
          type:
          - string
          - 'null'
          contentEncoding: base64
      required:
      - access_token
      - refresh_token
      - user_id
      - email
      - display_name
      - email_verified
      - locale
      - kdf_version
      - public_key
      - encrypted_private_key
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
      required:
      - access_token
      - refresh_token
    LogoutRequest:
      type: object
      properties:
        all_devices:
          type: boolean
          default: false
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        locale:
          type: string
        avatar_url:
          type: string
          description: Relative URL under `/avatars/v1/`; omitted when unset.
        email_verified:
          type: boolean
        has_public_key:
          type: boolean
        is_instance_admin:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - display_name
      - locale
      - email_verified
      - has_public_key
      - is_instance_admin
      - created_at
    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          type: string
        locale:
          type: string
          enum:
          - en
          - pt-BR
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
        kdf_salt:
          type: string
          format: byte
          contentEncoding: base64
        encrypted_private_key:
          type: string
          format: byte
          contentEncoding: base64
      required:
      - current_password
      - new_password
    RequestEmailChangeRequest:
      type: object
      properties:
        password:
          type: string
        new_email:
          type: string
          format: email
      required:
      - password
      - new_email
    AccountKeys:
      type: object
      properties:
        kdf_version:
          type: integer
          enum:
          - 0
          - 1
        kdf_salt:
          type:
          - string
          - 'null'
          contentEncoding: base64
        public_key:
          type:
          - string
          - 'null'
          contentEncoding: base64
        encrypted_private_key:
          type:
          - string
          - 'null'
          contentEncoding: base64
        has_recovery:
          type: boolean
      required:
      - kdf_version
      - kdf_salt
      - public_key
      - encrypted_private_key
      - has_recovery
    SetupKeysRequest:
      type: object
      properties:
        current_password:
          type: string
          description: Raw password for kdf 0, auth key for kdf 1.
        password:
          type: string
          description: New auth key.
        kdf_salt:
          type: string
          format: byte
          contentEncoding: base64
        public_key:
          type: string
          format: byte
          contentEncoding: base64
        encrypted_private_key:
          type: string
          format: byte
          contentEncoding: base64
        recovery_wrapped_private_key:
          type: string
          format: byte
          contentEncoding: base64
      required:
      - current_password
      - password
      - kdf_salt
      - public_key
      - encrypted_private_key
    RecoveryRequest:
      type: object
      properties:
        recovery_wrapped_private_key:
          type: string
          format: byte
          contentEncoding: base64
      required:
      - recovery_wrapped_private_key
    PublicKeyRequest:
      type: object
      properties:
        public_key:
          type: string
          format: byte
          contentEncoding: base64
          description: 32-byte X25519 public key.
      required:
      - public_key
    UserPublicKey:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        public_key:
          type: string
          format: byte
          contentEncoding: base64
      required:
      - user_id
      - public_key
    TokenRequest:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    ResetPrepareRequest:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    ResetPrepareResponse:
      type: object
      properties:
        public_key:
          type:
          - string
          - 'null'
          contentEncoding: base64
        recovery_wrapped_private_key:
          type:
          - string
          - 'null'
          contentEncoding: base64
      required:
      - public_key
      - recovery_wrapped_private_key
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
        kdf_salt:
          type: string
          format: byte
          contentEncoding: base64
        public_key:
          type: string
          format: byte
          contentEncoding: base64
        encrypted_private_key:
          type: string
          format: byte
          contentEncoding: base64
        recovery_wrapped_private_key:
          type: string
          format: byte
          contentEncoding: base64
      required:
      - token
      - password
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        device_name:
          type: string
        device_type:
          type: string
        last_seen_at:
          type: string
        created_at:
          type: string
        revoked:
          type: boolean
        is_current:
          type: boolean
          description: Only present (true) for the calling device.
      required:
      - id
      - device_name
      - device_type
      - last_seen_at
      - created_at
      - revoked
    UpdateDeviceRequest:
      type: object
      properties:
        device_name:
          type: string
      required:
      - device_name
    VaultCursor:
      type: object
      properties:
        vault_id:
          type: string
          format: uuid
        last_event_id:
          type: integer
          format: int64
        synced_at:
          type: string
          format: date-time
      required:
      - vault_id
      - last_event_id
      - synced_at
    OverviewDevice:
      allOf:
      - $ref: '#/components/schemas/Device'
      - type: object
        properties:
          vault_cursors:
            type: array
            items:
              $ref: '#/components/schemas/VaultCursor'
        required:
        - vault_cursors
    AccountOverview:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/Account'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/OverviewDevice'
        vaults:
          type: array
          items:
            $ref: '#/components/schemas/Vault'
        invites:
          type: array
          items:
            $ref: '#/components/schemas/Invite'
        subscription:
          $ref: '#/components/schemas/SubscriptionStatus'
          description: Only when subscriptions are enabled.
      required:
      - account
      - devices
      - vaults
      - invites
    CheckoutRequest:
      type: object
      properties:
        return_url:
          type: string
          format: uri
        completion_url:
          type: string
          format: uri
      required:
      - return_url
    CheckoutResponse:
      type: object
      properties:
        checkout_url:
          type: string
          format: uri
      required:
      - checkout_url
    SubscriptionStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - none
          - active
          - pending
          - expired
          - cancelled
        entitled:
          type: boolean
        current_period_start:
          type: string
          format: date-time
        current_period_end:
          type: string
          format: date-time
        entitlement_expires_at:
          type: string
          format: date-time
        billing_cycle:
          type: string
        plan_product_id:
          type: string
      required:
      - status
      - entitled
    Vault:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        owner_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - admin
          - editor
          - viewer
          - guest
        member_count:
          type: integer
        has_key:
          type: boolean
          description: The caller has a wrapped vault key.
        allowed_email_domains:
          type: array
          items:
            type: string
          description: Empty means any domain.
        allow_guests:
          type: boolean
        allow_public_links:
          type: boolean
        storage_used_bytes:
          type: integer
          format: int64
        storage_quota_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: '`null` means unlimited.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - description
      - icon
      - owner_id
      - role
      - member_count
      - has_key
      - allowed_email_domains
