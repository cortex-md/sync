        deviceId: []
  /sync/v1/vaults/{vaultID}/collab/tickets:
    post:
      operationId: createCollabTicket
      tags:
      - Collab
      summary: Create a collab WebSocket ticket
      description: |
        Short-lived (60 s), single-use ticket bound to user, vault and path. Request one per connection attempt. Feature-gated by `collab` (`404 feature_disabled`). Requires an active entitlement when subscription enforcement is enabled (in multi-tenant mode the vault owner's; `402`).

        Error codes: `400 invalid_input`, `403 forbidden` / `insufficient_role`.
      parameters:
      - $ref: '#/components/parameters/VaultID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollabTicketRequest'
      responses:
