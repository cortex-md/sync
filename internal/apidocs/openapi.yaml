  /sync/v1/vaults/{vaultID}/collab:
    get:
      operationId: collabConnect
      tags:
      - Collab
      summary: WebSocket for real-time co-editing (Yjs)
      description: |
        WebSocket upgrade (`101 Switching Protocols`). Not behind the bearer middleware: authentication is the `ticket`
        query parameter from `POST /collab/tickets` (60 s, single use). Feature-gated by `collab` (`404 feature_disabled`).

        Payloads (`update`, `awareness`, `sync_step1`, `sync_step2`, `compact`) are end-to-end encrypted envelopes
        `[0x01][nonce 12][AES-256-GCM ciphertext || tag 16]` relayed and stored as opaque bytes.

        Default frames are JSON text messages (`CollabMessage`, binary payloads base64 in `data`). With `frames=binary`,
        `sync_step1` (1), `sync_step2` (2), `update` (3) and `awareness` (4) travel as binary messages:
        client to server `[opcode u8][payload]`, server to client `[opcode u8][client_id length u8][client_id][payload]`.
        Control messages stay JSON in both modes.

        Close codes after the upgrade: `1001` server shutting down, `1008` room full, `1013` buffer full,
        `4402` subscription entitlement lapsed, `4403` access changed (reconnect), `4408` client too slow (reconnect and
        resync), `4429` too many messages.

        Errors before the upgrade: `400 invalid_input`, `401 unauthorized` (missing, invalid, expired or used ticket),
        `403 forbidden` / `insufficient_role`, `404 feature_disabled`, `429 rate_limited` (socket cap, `Retry-After: 5`),
        `503 unavailable` (draining).
      parameters:
      - $ref: '#/components/parameters/VaultID'
      - name: path
        in: query
        required: true
        description: Vault-relative file path.
        schema:
          type: string
      - name: ticket
        in: query
        required: true
        description: Collab ticket bound to this vault and path.
        schema:
          type: string
      - name: frames
        in: query
        required: false
        description: '`binary` to use binary frames for Yjs payloads.'
        schema:
          type: string
          enum:
          - binary
      responses:
        '101':
          description: Switching Protocols (WebSocket established)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FeatureDisabled'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
  /sync/v1/vaults/{vaultID}/collab/peers:
    get:
      operationId: getCollabPeers
      tags:
      - Collab
      summary: Peers editing a file
      description: |
        Feature-gated by `collab` (`404 feature_disabled`). Requires an active entitlement when subscription enforcement is enabled (in multi-tenant mode the vault owner's; `402`).

        Error codes: `400 invalid_input`, `403 forbidden` / `insufficient_role`.
      parameters:
      - $ref: '#/components/parameters/VaultID'
      - name: path
        in: query
