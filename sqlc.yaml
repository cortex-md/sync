version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/platform/postgres/queries
    gen:
      go:
        package: db
        out: internal/platform/postgres/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: "vault_role"
            go_type: "github.com/cortexnotes/cortex-sync/internal/domain.VaultRole"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
